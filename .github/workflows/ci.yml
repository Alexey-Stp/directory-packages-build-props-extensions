name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release runs the full CI suite on the tagged commit before publishing anything.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'

  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on placeholder identity
        run: |
          if git grep -nIi 'your-org' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Placeholder identity 'your-org' found; use the real repository URL."
            exit 1
          fi

  # The JSON contract (docs/JSON_SCHEMA.md) may only change together with a schemaVersion bump.
  contract-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require schemaVersion bump for contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Added files (a new snapshot scenario) do not change the contract; edits, deletions and renames do.
          changed=$(git diff --name-only --diff-filter=MDR "$BASE_SHA"...HEAD -- docs/schemas tests/CentralPackageMigrator.Integration.Tests/Contract/approved)
          if [ -z "$changed" ]; then
            echo "JSON contract unchanged."
            exit 0
          fi
          echo "JSON contract files changed:"
          echo "$changed"
          if git diff "$BASE_SHA"...HEAD -- src/CentralPackageMigrator.Core/Models/MigrationPlan.cs | grep -qE '^\+.*CurrentSchemaVersion = '; then
            echo "MigrationPlan.CurrentSchemaVersion was bumped."
          else
            echo "::error::The JSON contract changed without bumping MigrationPlan.CurrentSchemaVersion. See docs/JSON_SCHEMA.md#compatibility-rule."
            exit 1
          fi

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
