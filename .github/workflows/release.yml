name: Release

# A v* tag publishes a GitHub Release (binaries + SHA256SUMS.txt) and the dotnet tool to nuget.org.
# workflow_dispatch is a dry run: everything is built and verified, nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  build:
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: cpm-migrate-win-x64.exe
          - rid: linux-x64
            os: ubuntu-latest
            artifact: cpm-migrate-linux-x64
          - rid: osx-x64
            os: macos-15-intel # native x64 so the signed binary can be run and verified
            artifact: cpm-migrate-osx-x64
          - rid: osx-arm64
            os: macos-latest
            artifact: cpm-migrate-osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/CentralPackageMigrator.Cli/CentralPackageMigrator.Cli.csproj
          --self-contained
          -r ${{ matrix.rid }}
          -c Release
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv publish/cpm-migrate publish/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv publish/cpm-migrate.exe publish/${{ matrix.artifact }}
        shell: bash

      # Signing is skipped with a warning when secrets are absent (forks, dry runs),
      # but a v* tag never produces an unsigned Windows or macOS binary.
      - name: Check signing configuration
        id: signing
        if: runner.os != 'Linux'
        shell: bash
        env:
          WINDOWS_CONFIGURED: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' }}
          MACOS_CONFIGURED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then configured="$WINDOWS_CONFIGURED"; else configured="$MACOS_CONFIGURED"; fi
          if [ "$configured" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Signing secrets for $RUNNER_OS are missing; refusing to release an unsigned binary."
            exit 1
          else
            echo "::warning::Signing skipped for ${{ matrix.artifact }} (no secrets): this artifact is UNSIGNED."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign (Windows, Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\publish\${{ matrix.artifact }}
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Verify signature (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "publish/${{ matrix.artifact }}"
          if ($signature.Status -ne 'Valid') {
            Write-Output "::error::Authenticode signature is $($signature.Status): $($signature.StatusMessage)"
            exit 1
          }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BINARY: publish/${{ matrix.artifact }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi

          codesign --force --timestamp --options runtime \
            --entitlements build/macos/entitlements.plist \
            --sign "$identity" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          # A bare Mach-O cannot be stapled; Gatekeeper fetches the notarization ticket online.
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarize.json"
          cat "$RUNNER_TEMP/notarize.json"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notarize.json")
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization status: $status"
            exit 1
          fi

      - name: Clean up signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/api-key.p8"

      # Runs the final (signed) binary on its own platform and fails on a tag/version mismatch.
      - name: Verify binary runs and reports the tag version
        shell: bash
        run: |
          binary="publish/${{ matrix.artifact }}"
          chmod +x "$binary"
          version=$("$binary" --version)
          echo "${{ matrix.artifact }} reports $version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::${{ matrix.artifact }} reports '$version', expected '${GITHUB_REF_NAME#v}'."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}
          if-no-files-found: error

  pack:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack dotnet tool
        run: dotnet pack src/CentralPackageMigrator.Cli/CentralPackageMigrator.Cli.csproj -c Release -o nupkg

      # Never publish a mislabeled artifact: tag, package version and --version must agree.
      - name: Verify version matches tag
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          packages=(nupkg/CentralPackageMigrator.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one CentralPackageMigrator package, found ${#packages[@]}."
            exit 1
          fi
          name=$(basename "${packages[0]}" .nupkg)
          package_version="${name#CentralPackageMigrator.}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$package_version" != "$tag_version" ]; then
              echo "::error::Package version $package_version does not match tag $GITHUB_REF_NAME."
              exit 1
            fi
          fi

          dotnet tool install CentralPackageMigrator --tool-path "$RUNNER_TEMP/tool" --add-source nupkg --version "$package_version"
          tool_version=$("$RUNNER_TEMP/tool/cpm-migrate" --version)
          if [ "$tool_version" != "$package_version" ]; then
            echo "::error::cpm-migrate --version reports '$tool_version', package is '$package_version'."
            exit 1
          fi

          echo "Verified version $package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  github-release:
    needs: [build, pack]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cpm-migrate-*
          path: release
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum cpm-migrate-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SLSA build provenance: verify with `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/cpm-migrate-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            release/*

  nuget-publish:
    needs: [pack, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: nupkg/*.nupkg

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured."
            exit 1
          fi
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
