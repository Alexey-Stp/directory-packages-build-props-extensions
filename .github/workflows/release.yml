name: Release

# A v* tag publishes a GitHub Release (binaries + SHA256SUMS.txt) and the dotnet tool to nuget.org.
# workflow_dispatch is a dry run: everything is built and verified, nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: cpm-migrate-win-x64.exe
          - rid: linux-x64
            os: ubuntu-latest
            artifact: cpm-migrate-linux-x64
          - rid: osx-x64
            os: macos-latest
            artifact: cpm-migrate-osx-x64
          - rid: osx-arm64
            os: macos-latest
            artifact: cpm-migrate-osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/CentralPackageMigrator.Cli/CentralPackageMigrator.Cli.csproj
          --self-contained
          -r ${{ matrix.rid }}
          -c Release
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv publish/cpm-migrate publish/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv publish/cpm-migrate.exe publish/${{ matrix.artifact }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}
          if-no-files-found: error

  pack:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack dotnet tool
        run: dotnet pack src/CentralPackageMigrator.Cli/CentralPackageMigrator.Cli.csproj -c Release -o nupkg

      # Never publish a mislabeled artifact: tag, package version and --version must agree.
      - name: Verify version matches tag
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          packages=(nupkg/CentralPackageMigrator.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one CentralPackageMigrator package, found ${#packages[@]}."
            exit 1
          fi
          name=$(basename "${packages[0]}" .nupkg)
          package_version="${name#CentralPackageMigrator.}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$package_version" != "$tag_version" ]; then
              echo "::error::Package version $package_version does not match tag $GITHUB_REF_NAME."
              exit 1
            fi
          fi

          dotnet tool install CentralPackageMigrator --tool-path "$RUNNER_TEMP/tool" --add-source nupkg --version "$package_version"
          tool_version=$("$RUNNER_TEMP/tool/cpm-migrate" --version)
          if [ "$tool_version" != "$package_version" ]; then
            echo "::error::cpm-migrate --version reports '$tool_version', package is '$package_version'."
            exit 1
          fi

          echo "Verified version $package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  github-release:
    needs: [build, pack]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cpm-migrate-*
          path: release
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum cpm-migrate-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            release/*

  nuget-publish:
    needs: [pack, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured."
            exit 1
          fi
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
