name: SonarQube

# Static analysis and coverage for SonarQube Cloud. Kept out of ci.yml because release.yml
# reuses ci.yml via workflow_call, which does not pass SONAR_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build and analyze
    # Fork PRs get no secrets, so the scanner could not authenticate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for MinVer and for Sonar blame/new-code detection
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Restore local tools
        run: dotnet tool restore
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet dotnet-sonarscanner begin
          /k:"Alexey-Stp_directory-packages-build-props-extensions"
          /o:"alexey-stp"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
      - name: Build
        id: build
        run: dotnet build --configuration Release
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --logger trx --results-directory TestResults
      - name: End analysis
        # Still report when tests fail, but not when the build itself broke.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
